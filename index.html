<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base target="_top">
<title>ICU Round Book</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root{
    --bg:#eef2f4; --surface:#ffffff; --surface-2:#e7edf0; --line:#d3dde2;
    --ink:#0f1d26; --ink-2:#4b5e69; --ink-3:#83949d;
    --accent:#0e5e8a; --accent-ink:#ffffff; --accent-soft:#dcebf4; --accent-soft-ink:#0a4a6e;
    --mon-bg:#0b1419; --mon-line:#1d2c34; --mon-label:#7f9aa6;
    --hr:#3ee07a; --bp:#ff7a7a; --spo2:#45d3f2; --temp:#f5c542;
    --abn-bg:#3a1414; --abn-line:#ff5c5c;
    --crit:#b3261e; --crit-bg:#fde6e4; --ser:#a95c00; --ser-bg:#fff0d9;
    --stab:#1c7447; --stab-bg:#e1f3e8; --shift:#2c5cb0; --shift-bg:#e4ebfa;
    --out:#5e6b72; --out-bg:#e8ecee; --warn:#9a5a00; --warn-bg:#fff2dc;
    --surg:#6a3fb0; --surg-bg:#efe7fb;
    --radius:12px; --radius-s:8px;
    --shadow:0 1px 2px rgba(15,29,38,.06),0 2px 8px rgba(15,29,38,.05);
    --shadow-2:0 18px 48px rgba(15,29,38,.22);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0c1318; --surface:#131d23; --surface-2:#1a262d; --line:#26353d;
      --ink:#e5edf1; --ink-2:#a3b3bb; --ink-3:#6f818a;
      --accent:#5cb8e8; --accent-ink:#06202e; --accent-soft:#16303f; --accent-soft-ink:#9ad4f2;
      --mon-bg:#070d10; --mon-line:#1a272e;
      --crit:#ff8a80; --crit-bg:#3d1714; --ser:#f3b25c; --ser-bg:#3a2810;
      --stab:#6fd69c; --stab-bg:#15321f; --shift:#8fb0f0; --shift-bg:#1a2745;
      --out:#9aa7ae; --out-bg:#20292e; --warn:#f3b25c; --warn-bg:#3a2810;
      --surg:#c4a6f5; --surg-bg:#2a2040;
      --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-2:0 18px 48px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0c1318; --surface:#131d23; --surface-2:#1a262d; --line:#26353d;
    --ink:#e5edf1; --ink-2:#a3b3bb; --ink-3:#6f818a;
    --accent:#5cb8e8; --accent-ink:#06202e; --accent-soft:#16303f; --accent-soft-ink:#9ad4f2;
    --mon-bg:#070d10; --mon-line:#1a272e;
    --crit:#ff8a80; --crit-bg:#3d1714; --ser:#f3b25c; --ser-bg:#3a2810;
    --stab:#6fd69c; --stab-bg:#15321f; --shift:#8fb0f0; --shift-bg:#1a2745;
    --out:#9aa7ae; --out-bg:#20292e; --warn:#f3b25c; --warn-bg:#3a2810;
    --surg:#c4a6f5; --surg-bg:#2a2040;
    --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-2:0 18px 48px rgba(0,0,0,.6);
  }

  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html{color-scheme:light dark}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;padding-inline:16px;font-variant-numeric:tabular-nums}
  h1,h2,h3,h4{font-family:"Archivo","IBM Plex Sans",system-ui,sans-serif;margin:0;text-wrap:balance}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* ---------- top bar ---------- */
  .top{position:sticky;top:0;z-index:20;background:var(--bg);margin:0 -16px;padding:12px 16px 10px;border-bottom:1px solid var(--line)}
  .top-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .mark{width:38px;height:38px;border-radius:9px;background:var(--mon-bg);display:grid;place-items:center;flex:none}
  .unit h1{font-size:19px;font-weight:800;letter-spacing:-.01em}
  .unit .sub{font-size:12px;color:var(--ink-2);margin-top:1px}
  .top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .signas{font-size:12px;color:var(--ink-2);background:none;border:1px dashed var(--line);border-radius:999px;padding:6px 11px}
  .signas b{color:var(--ink);font-weight:600}
  .btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-s);padding:8px 12px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;line-height:1.1;white-space:nowrap}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
  .btn.danger{color:var(--crit);border-color:var(--crit)}
  .btn.small{padding:6px 9px;font-size:12px}
  .btn.chart{background:var(--mon-bg);color:var(--hr);border-color:var(--mon-bg);letter-spacing:.04em;font-size:12px}
  .btn[disabled]{opacity:.5;cursor:not-allowed}
  .linkbtn{background:none;border:0;color:var(--accent);font-weight:600;font-size:12.5px;padding:0}

  .stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:10px}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
  .stat .n{font-family:"Archivo",sans-serif;font-size:22px;font-weight:800;line-height:1}
  .stat .l{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);font-weight:600;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stat.crit .n{color:var(--crit)} .stat.warn .n{color:var(--warn)}
  @media (max-width:600px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.stat:nth-child(n+4){display:none}}
  .banner{margin:12px 0 0;padding:9px 12px;border-radius:var(--radius-s);background:var(--warn-bg);color:var(--warn);font-size:12.5px;font-weight:500}

  main{padding-bottom:100px}
  .controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0 12px}
  #q{flex:1 1 220px;min-width:0;padding:9px 12px;border:1px solid var(--line);border-radius:var(--radius-s);background:var(--surface)}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tab{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:600}
  .tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .tab .c{opacity:.7;margin-left:3px}

  /* ---------- cards ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
  @media (max-width:400px){.grid{grid-template-columns:1fr}}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:9px;cursor:pointer;text-align:left;width:100%}
  .card:hover{border-color:var(--accent)}
  .c-top{display:flex;gap:10px;align-items:flex-start}
  .bedno{flex:none;min-width:46px;height:46px;padding:0 6px;border-radius:10px;display:grid;place-items:center;font-family:"Archivo",sans-serif;font-weight:800;font-size:18px;background:var(--st-bg);color:var(--st)}
  .c-id{flex:1;min-width:0}
  .c-name{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .c-meta{font-size:12px;color:var(--ink-2);margin-top:2px}
  .pill{flex:none;display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:700;background:var(--st-bg);color:var(--st);white-space:nowrap}
  .pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
  .s-critical{--st:var(--crit);--st-bg:var(--crit-bg)}
  .s-serious{--st:var(--ser);--st-bg:var(--ser-bg)}
  .s-stable,.s-improving{--st:var(--stab);--st-bg:var(--stab-bg)}
  .s-shift{--st:var(--shift);--st-bg:var(--shift-bg)}
  .s-out,.s-lama,.s-expired,.s-none{--st:var(--out);--st-bg:var(--out-bg)}
  .tags{display:flex;flex-wrap:wrap;gap:5px}
  .tag{font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--surface-2);color:var(--ink-2)}
  .tag.code{background:var(--ink);color:var(--bg)}
  .tag.allergy{background:var(--crit-bg);color:var(--crit)}
  .c-dx{margin:0;padding:0;list-style:none;font-size:13px;line-height:1.4;display:flex;flex-direction:column;gap:2px}
  .c-dx li{display:flex;gap:6px;justify-content:space-between}
  .c-dx .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .c-dx .b{flex:none;font-size:11px;font-weight:700;color:var(--ink-3)}
  .c-dx .b.pod{color:var(--surg)}
  .monitor{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--mon-bg);border-radius:10px;overflow:hidden}
  .v{padding:7px 9px;border-right:1px solid var(--mon-line);min-width:0;display:flex;flex-direction:column;gap:1px}
  .v:last-child{border-right:0}
  .vl{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mon-label);font-weight:600}
  .vn{font-family:"IBM Plex Mono",ui-monospace,monospace;font-weight:600;font-size:19px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .vs{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;color:var(--mon-label);white-space:nowrap}
  .v-hr .vn{color:var(--hr)} .v-bp .vn{color:var(--bp)} .v-spo2 .vn{color:var(--spo2)} .v-temp .vn{color:var(--temp)}
  .v.empty .vn{color:#3b4d56}
  .v.abn{background:var(--abn-bg);box-shadow:inset 0 -2px 0 var(--abn-line)}
  .v.abn .vl{color:#ffb4b4}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chip.vent{background:var(--accent-soft);color:var(--accent-soft-ink)}
  .chip.alert{background:var(--crit-bg);color:var(--crit)}
  .chip.warn{background:var(--warn-bg);color:var(--warn)}
  .c-ho{font-size:12px;color:var(--ink-2);background:var(--surface-2);border-radius:8px;padding:6px 9px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .c-foot{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:11.5px;color:var(--ink-3);flex-wrap:wrap}
  .c-foot .stale{color:var(--warn);font-weight:600}
  .empty-state{border:1px dashed var(--line);border-radius:var(--radius);background:var(--surface);padding:40px 20px;text-align:center;color:var(--ink-2)}
  .empty-state h2{font-size:17px;color:var(--ink);margin-bottom:6px}
  .empty-state p{margin:0 auto 14px;max-width:44ch;line-height:1.5}
  .fab{position:fixed;right:18px;bottom:18px;z-index:25;border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);padding:14px 20px;font-weight:700;font-size:14px;box-shadow:var(--shadow-2)}

  /* ---------- patient view ---------- */
  .scrim{position:fixed;inset:0;background:rgba(6,14,19,.5);z-index:40}
  .pv{position:fixed;top:0;right:0;bottom:0;width:min(980px,100%);background:var(--bg);z-index:41;display:flex;flex-direction:column;box-shadow:var(--shadow-2)}
  .pv-head{background:var(--surface);border-bottom:1px solid var(--line);padding:12px 16px 0;display:flex;flex-direction:column;gap:8px}
  .pv-title{display:flex;gap:10px;align-items:center}
  .pv-title .bedno{min-width:42px;height:42px;font-size:16px}
  .pv-title .who{flex:1;min-width:0}
  .pv-title h2{font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pv-title .meta{font-size:12px;color:var(--ink-2);margin-top:2px}
  .x{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-s);width:38px;height:38px;font-size:18px;flex:none}
  .ptabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin;margin:0 -16px;padding:0 12px}
  .ptab{flex:none;background:none;border:0;border-bottom:3px solid transparent;padding:9px 10px 8px;font-size:13px;font-weight:600;color:var(--ink-2);display:inline-flex;gap:6px;align-items:center}
  .ptab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
  .ptab .dot{min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:var(--crit);color:#fff;font-size:10.5px;display:grid;place-items:center}
  .pv-body{flex:1;overflow-y:auto;padding:14px 16px 40px;display:flex;flex-direction:column;gap:14px}
  .sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
  .sec-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .sec h3{font-size:14.5px;font-weight:700}
  .sec > h3{margin-bottom:10px}
  .hint{font-size:12px;color:var(--ink-3);font-weight:500}
  .fgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
  .f{display:flex;flex-direction:column;gap:4px;min-width:0}
  .f.w1{grid-column:span 1} .f.w2{grid-column:span 2} .f.w3{grid-column:span 3} .f.w6{grid-column:span 6}
  @media (max-width:760px){.fgrid{grid-template-columns:repeat(4,minmax(0,1fr))}.f.w3{grid-column:span 4}.f.w6{grid-column:span 4}}
  @media (max-width:480px){.fgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.f.w2,.f.w3,.f.w6{grid-column:span 2}}
  label,.lbl{font-size:11.5px;font-weight:600;color:var(--ink-2)}
  input[type=text],input[type=number],input[type=date],input[type=datetime-local],input:not([type]),select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-s);padding:8px 10px;font-size:14px;min-width:0}
  textarea{resize:vertical;min-height:44px;line-height:1.45}
  .form-end{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
  .form-end .grow{flex:1;font-size:12.5px;color:var(--ink-2)}
  .form-end .grow b{color:var(--ink);font-family:"IBM Plex Mono",monospace}
  .syschips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .sys{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:13px;cursor:pointer;user-select:none}
  .sys input{accent-color:var(--crit);margin:0}
  .sys:has(input:checked){background:var(--crit-bg);color:var(--crit);border-color:transparent;font-weight:600}
  .seg{display:flex;gap:6px;flex-wrap:wrap}
  .seg label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--ink);cursor:pointer}
  .seg input{margin:0}
  .seg label:has(input:checked){background:var(--accent-soft);color:var(--accent-soft-ink);border-color:var(--accent)}
  form[data-mgmt="conservative"] .surg-only{display:none}
  form:not([data-ins="public"]):not([data-ins="private"]) .ins-name{display:none}

  .todo{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
  .todo:last-child{border-bottom:0}
  .todo input{margin-top:3px;width:17px;height:17px;accent-color:var(--accent);flex:none}
  .todo .t{flex:1;min-width:0;line-height:1.4}
  .todo.done .t > span:first-child{text-decoration:line-through;color:var(--ink-3)}
  .by{display:block;font-size:11px;color:var(--ink-3)}
  .del{background:none;border:0;color:var(--ink-3);font-size:17px;padding:0 4px;line-height:1}
  .addrow{display:flex;gap:8px;margin-top:10px}
  .addrow input{flex:1}
  .none{margin:0;color:var(--ink-3);font-size:13px}

  .dx{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
  .dx + .dx{margin-top:10px}
  .dx-h{display:flex;gap:10px;align-items:flex-start}
  .dx-n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:12px;font-weight:700}
  .dx-t{flex:1;font-weight:700;font-size:14.5px;line-height:1.35}
  .mg{flex:none;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px}
  .mg.surgical{background:var(--surg-bg);color:var(--surg)}
  .mg.conservative{background:var(--stab-bg);color:var(--stab)}
  .dx-surg{font-size:13px;color:var(--ink-2)}
  .pod{color:var(--surg);font-family:"IBM Plex Mono",monospace;margin-left:6px}
  .dx-plan{font-size:13.5px;line-height:1.5;white-space:pre-wrap;background:var(--surface-2);border-radius:8px;padding:8px 10px}
  .dx-plan .lbl{display:block;margin-bottom:2px}
  .rowfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-3)}
  .rowfoot .acts{display:flex;gap:6px}

  .item{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
  .item:last-child{border-bottom:0}
  .item .main{flex:1;min-width:0;line-height:1.4}
  .item .main b{font-weight:700}
  .item .acts{display:flex;gap:6px;flex:none}
  .kind{flex:none;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 7px;border-radius:6px;background:var(--surface-2);color:var(--ink-2);margin-top:1px}
  .dayn{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:12.5px;color:var(--accent);white-space:nowrap}
  .alertbox{background:var(--crit-bg);color:var(--crit);border-radius:var(--radius);padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:13px}
  .alertbox b{font-weight:700}
  .okbox{background:var(--stab-bg);color:var(--stab);border-radius:var(--radius);padding:10px 14px;font-size:12.5px;font-weight:600}

  .tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
  table.t{border-collapse:collapse;width:100%;font-size:12.5px;white-space:nowrap}
  table.t th,table.t td{padding:6px 9px;border-bottom:1px solid var(--line);text-align:left}
  table.t th{background:var(--surface-2);font-weight:700;font-size:11.5px;color:var(--ink-2);position:sticky;top:0}
  table.t td.num{font-family:"IBM Plex Mono",monospace}
  table.t td.ab{color:var(--crit);font-weight:700;background:var(--crit-bg)}
  table.t td.rowh,table.t th.rowh{position:sticky;left:0;background:var(--surface);font-weight:600;z-index:1}
  table.t th.rowh{background:var(--surface-2);z-index:2}
  table.t tr:last-child td{border-bottom:0}
  table.t .by{display:inline;font-size:11px}
  .trend{width:100%;height:auto;display:block;margin-bottom:10px}
  .legend{display:flex;gap:14px;font-size:12px;color:var(--ink-2);margin-bottom:6px;flex-wrap:wrap}
  .legend i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}

  .cult{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:7px}
  .cult + .cult{margin-top:10px}
  .cult-h{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
  .cult-h b{font-size:14px}
  .st{font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px}
  .st.sent{background:var(--warn-bg);color:var(--warn)}
  .st.nogrowth{background:var(--stab-bg);color:var(--stab)}
  .st.growth{background:var(--crit-bg);color:var(--crit)}
  .st.contam{background:var(--out-bg);color:var(--out)}
  .org{font-weight:700;font-style:italic}
  .sr{font-size:13px;line-height:1.45}
  .sr .s{color:var(--stab);font-weight:700} .sr .r{color:var(--crit);font-weight:700} .sr .i{color:var(--warn);font-weight:700}
  .files{display:flex;flex-wrap:wrap;gap:6px}
  .filebtn{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:5px 9px;font-size:12px;font-weight:600}

  var LAB = {}; LAB_GROUPS.forEach(function(g){ g[1].forEach(function(t){ LAB[t[0]] = {unit:t[1], lo:t[2], hi:t[3]}; }); });

  var DEFAULT_LABS = ["Hb","TLC","Platelets","Urea","Creatinine","Sodium","Potassium","PT","INR","T. Bilirubin","SGOT (AST)","SGPT (ALT)","Albumin","CRP"];

  function out(v, lo, hi){ var n = num(v); if(n == null) return false; return (lo != null && n < lo) || (hi != null && n > hi); }

        var list = this.localList(); var i = list.findIndex(function(p){ return p.id === id; });
        if(i < 0) throw errOf("NOT_FOUND");
        applyPatch(list[i], patch); this.localSave(list); return;
      }
      await this.write("update", {id:id, patch:patch});
    },
    remove: async function(id){
      if(this.mode === "local"){ this.localSave(this.localList().filter(function(p){ return p.id !== id; })); return; }
      await this.write("remove", {id:id});
    },
    upload: async function(args){
      if(this.mode === "local") throw {code:"local"};

    },

  /* ---------- state ---------- */
  var patients = [], loaded = false, unitName = "ICU";

        '<div class="f"><label for="sigInput">Name</label><input type="text" id="sigInput" placeholder="e.g. Dr. Rao, Sr. Anu" value="' + esc(sigName()) + '"></div>' +
        '<div class="f"><label for="roleInput">Role</label><select id="roleInput">' + roles.map(function(r){ return '<option' + (r === sigRole() ? " selected" : "") + '>' + r + '</option>'; }).join("") + '</select></div>' +
        '<div class="r"><button class="btn" data-close type="button">Cancel</button><button class="btn primary" id="sigSave" type="button">Save</button></div>',
        function(root, close){
          var inp = $("#sigInput", root); inp.focus();
          function done(){ var v = inp.value.trim(); if(!v){ inp.focus(); return; } LS.set("icurb_sig", v); LS.set("icurb_role", $("#roleInput", root).value); paintSig(); close(); resolve(sigBy()); }

  /* ---------- UI helpers ---------- */

  function modal(html, wire, onCancel, wide){
    var wrap = document.createElement("div"); wrap.className = "modal-wrap";
    wrap.innerHTML = '<div class="modal' + (wide ? " wide" : "") + '" role="dialog" aria-modal="true">' + html + '</div>';
    $("#modalRoot").appendChild(wrap);
    var closed = false;
    function close(){ if(closed) return; closed = true; wrap.remove(); }
    function cancel(){ close(); if(onCancel) onCancel(); }
    wrap._cancel = cancel;
    wrap.addEventListener("mousedown", function(e){ if(e.target === wrap) cancel(); });

  function writeErr(e){
    var c = e && e.code;
    if(c === "pin"){ Store.pin = ""; LS.set(PKEY, ""); showGate("The unit PIN has changed. Enter the new PIN, then save again."); return "Not saved: PIN needed"; }
    if(c === "gone"){ Store.refresh(); return "That patient was removed by someone else."; }
    if(c === "big") return "This patient's record is full. Delete old entries (e.g. old lab reports) and try again.";
    if(c === "file") return "Only photos and PDFs up to 8 MB can be uploaded.";

  }
  var fid = 0;
  function F(name, label, type, w, o){

    name = esc(name);

      ctl = '<select id="' + id + '" name="' + name + '"' + extra + '>' + o.opts.map(function(x){ var val = Array.isArray(x) ? x[0] : x, lab = Array.isArray(x) ? x[1] : x; return '<option value="' + esc(val) + '"' + (String(val) === String(v) ? " selected" : "") + '>' + esc(lab) + '</option>'; }).join("") + '</select>';
    } else if(type === "textarea"){
      ctl = '<textarea id="' + id + '" name="' + name + '" rows="' + (o.rows || 2) + '"' + extra + '>' + esc(v) + '</textarea>';
    } else {
      ctl = '<input id="' + id + '" name="' + name + '" type="' + type + '" value="' + esc(v) + '"' + (type === "number" ? ' step="any" inputmode="decimal"' : "") + extra + '>';

  }
  function formData(form){
    var d = {};
    $$("[name]", form).forEach(function(el){
      if(el.type === "checkbox"){ if(!d[el.name]) d[el.name] = []; if(el.checked) d[el.name].push(el.value); }
      else if(el.type === "radio"){ if(el.checked) d[el.name] = el.value; }
      else d[el.name] = el.value.trim();
    });
    return d;
  }
  function fillForm(form, obj){
    $$("[name]", form).forEach(function(el){
      var v = obj[el.name];
      if(el.type === "checkbox") el.checked = Array.isArray(v) && v.indexOf(el.value) >= 0;
      else if(el.type === "radio") el.checked = String(v) === el.value;
      else el.value = v == null ? "" : v;
    });
  }
  function OP(op, list, a, b){ return op === "push" ? {op:"push", list:list, item:a, cap:b} : op === "upd" ? {op:"upd", list:list, id:a, fields:b} : {op:"del", list:list, id:a}; }

  /* commit(build): build(by, now) returns {fields, ops, log} */
  async function commit(build, okMsg){
    var p = cur(); if(!p) return false;
    var by = await needSig(); if(!by) return false;
    var now = nowISO();
    var r = build(by, now, p); if(!r) return false;
    var ops = (r.ops || []).slice();
    if(r.log) ops.push(OP("push", "log", {id:uid(), at:now, by:by, text:r.log}, 150));
    var patch = Object.assign({}, r.fields || {}, {updatedAt:now, updatedByName:by, $ops:ops});
    try{ await Store.update(p.id, patch); if(okMsg) toast(okMsg); return true; }
    catch(e){ toast(writeErr(e)); return false; }
  }

  /* ---------- top: clock, stats, filters ---------- */

  function active(){ return patients.filter(function(p){ return !archived(p); }); }

  /* ---------- cards ---------- */

  function respText(r){
    if(!r) return "";

    return [r.support, r.flow ? r.flow + " L/min" : "", r.fio2 && r.support !== "Room air" ? "FiO₂ " + r.fio2 + "%" : ""].filter(Boolean).join(" · ");
  }
  function condKey(p){ return COND[p.condition] ? p.condition : "none"; }
  function card(p){
    var ck = condKey(p), v = latest(p.vitals), r = latest(p.resp), d = dayN(p.admitDate);

    if(p.insurance) tags.push('<span class="tag">' + esc(p.insurance) + '</span>');
    (p.systems || []).forEach(function(s){ tags.push('<span class="tag">' + esc(s) + '</span>'); });
    var dx = p.dx || [];
    var dxh = dx.length ? '<ul class="c-dx">' + dx.slice(0, 3).map(function(x){ var b = dxBadge(x); return '<li><span class="t">' + esc(x.text) + '</span><span class="b' + (/POD|Surgery in/.test(b) ? " pod" : "") + '">' + esc(b) + '</span></li>'; }).join("") + (dx.length > 3 ? '<li><span class="b">+' + (dx.length - 3) + ' more</span></li>' : "") + '</ul>' : "";
    var chips = [];

  var INS_TYPES = [["","— Select —"],["public","Public insurance"],["private","Private insurance"],["cash","Cash / self-pay"]];

  function openAdmit(){

  /* ---------- patient view ---------- */
  var PTABS = [["sum","Summary"],["dx","Diagnosis & plan"],["vit","Vitals"],["resp","Respiratory & ABG"],["lines","Infusions & lines"],["abx","Antibiotics"],["io","Intake / output"],["labs","Labs"],["cult","Cultures"],["ho","Handover"]];
  function cur(){ return view.id ? patients.filter(function(p){ return p.id === view.id; })[0] || null : null; }

  function paintHead(p){

  function trendSvg(list){

    var grid = [0,50,100,150,200].map(function(g){ return '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(g) + '" y2="' + y(g) + '" stroke="var(--line)" stroke-width="1"/><text x="' + (L - 6) + '" y="' + (y(g) + 4) + '" text-anchor="end" font-size="10" fill="var(--ink-3)">' + g + '</text>'; }).join("");

  async function viewFile(id, name){
    var w = modal('<div class="modal-h"><h2>' + esc(name) + '</h2><button class="x" type="button" data-close aria-label="Close">×</button></div><div class="viewer" id="fview"><p>Loading…</p></div>', null, null, true);
    try{
      var f = await Store.file(id);
      var bin = atob(f.b64), arr = new Uint8Array(bin.length);
      for(var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      var url = URL.createObjectURL(new Blob([arr], {type:f.mime}));
      $("#fview", w).innerHTML = (/^image\//.test(f.mime) ? '<img src="' + url + '" alt="' + esc(name) + '">' : '<iframe src="' + url + '" title="' + esc(name) + '"></iframe>') +
        '<div class="r" style="margin-top:10px"><a class="btn" href="' + url + '" target="_blank" rel="noopener">Open full screen</a></div>';
    }catch(e){ $("#fview", w).innerHTML = '<p>Couldn\'t open the file. ' + esc(writeErr(e)) + '</p>'; }
  }

  function readAsDataURL(file){ return new Promise(function(res, rej){ var r = new FileReader(); r.onload = function(){ res(r.result); }; r.onerror = rej; r.readAsDataURL(file); }); }
  function loadImg(src){ return new Promise(function(res, rej){ var i = new Image(); i.onload = function(){ res(i); }; i.onerror = rej; i.src = src; }); }
  async function prepFile(file){
    if(/^image\//.test(file.type)){
      var src = await readAsDataURL(file);
      if(file.size < 900000) return {mime:file.type, name:file.name, b64:src.split(",")[1]};
      var img = await loadImg(src), s = Math.min(1, 2200/Math.max(img.width, img.height));
      var c = document.createElement("canvas"); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      return {mime:"image/jpeg", name:file.name.replace(/\.[^.]+$/, "") + ".jpg", b64:c.toDataURL("image/jpeg", 0.85).split(",")[1]};
    }
    if(file.type !== "application/pdf") throw {code:"file"};
    if(file.size > 8e6) throw {code:"file"};
    return {mime:file.type, name:file.name, b64:(await readAsDataURL(file)).split(",")[1]};
  }

      var list = byTime(p.resp);
      chartModal("Parameter chart · Bed " + (p.bed || "") + " · " + (p.name || ""), list.length ? '<p class="hint" style="margin:0">' + list.length + ' updates (the last 40 are kept), newest first.</p><div class="tablewrap"><table class="t"><thead><tr><th>Time</th><th>Support</th><th>Mode</th>' + RESP_F.map(function(x){ return "<th>" + x[1] + "</th>"; }).join("") + '<th>Vt ml/kg</th><th>By</th></tr></thead><tbody>' +
        list.map(function(r){ var w = num(p.weight), vt = num(r.vt); return '<tr><td class="num">' + stamp(r.at) + '</td><td>' + esc(r.support || "") + '</td><td>' + esc(r.mode || "") + '</td>' + RESP_F.map(function(x){ return '<td class="num">' + esc(r[x[0]] || "") + '</td>'; }).join("") + '<td class="num">' + (w && vt ? (vt/w).toFixed(1) : "") + '</td><td><span class="by">' + esc(r.by || "") + '</span></td></tr>'; }).join("") +
        '</tbody></table></div>' : '<p>No parameters yet.</p>');
    },
    abgChart: function(el, p){
      var all = byTime(p.abg);
      function render(showAll){
        var list = showAll ? all : all.slice(0, 5);
        return '<p class="hint" style="margin:0">' + (showAll ? "All " + all.length : "Last " + list.length + " of " + all.length) + ' ABG reports, newest first. Red = outside the usual range.</p>' +
          '<div class="tablewrap"><table class="t"><thead><tr><th class="rowh">Parameter</th>' + list.map(function(a){ return "<th>" + stamp(a.at) + "</th>"; }).join("") + '</tr></thead><tbody>' +
          ABG_F.map(function(x){ return '<tr><td class="rowh">' + x[1] + (x[2] ? ' <span class="by">' + x[2] + '</span>' : "") + '</td>' + list.map(function(a){ return '<td class="num' + (out(a[x[0]], x[3], x[4]) ? " ab" : "") + '">' + esc(a[x[0]] || "") + '</td>'; }).join("") + '</tr>'; }).join("") +
          '<tr><td class="rowh">P/F ratio</td>' + list.map(function(a){ var pf = pfOf(a.po2, a.fio2); return '<td class="num' + (pf && pf < 300 ? " ab" : "") + '">' + (pf || "") + '</td>'; }).join("") + '</tr>' +
          '<tr><td class="rowh">By</td>' + list.map(function(a){ return '<td><span class="by">' + esc(a.by || "") + '</span></td>'; }).join("") + '</tr></tbody></table></div>' +
          (all.length > 5 ? '<div class="r"><button class="btn small" type="button" id="abgAll">' + (showAll ? "Show last 5" : "Show all " + all.length) + '</button></div>' : "");
      }
      if(!all.length){ chartModal("ABG chart", "<p>No ABG reports yet.</p>"); return; }
      var showAll = false;
      chartModal("ABG chart · Bed " + (p.bed || "") + " · " + (p.name || ""), '<div id="abgBox">' + render(false) + '</div>');
      var box = $("#abgBox");
      box.addEventListener("click", function(e){ if(e.target.id === "abgAll"){ showAll = !showAll; box.innerHTML = render(showAll); } });
    },
    editLine: function(el, p){
      var l = find(p.lines, el.dataset.id); if(!l) return;
      editModal("Edit " + l.kind, '<div class="fgrid">' + F("detail", "Details", "text", 6, {value:l.detail}) + F("site", "Site", "text", 3, {value:l.site}) + F("start", "Started / inserted on", "date", 3, {value:l.start}) + '</div>', function(v){
        return commit(function(b, now){ return {ops:[OP("upd", "lines", l.id, {detail:v.detail, site:v.site, start:v.start, at:now, by:b})], log:l.kind + " updated: " + v.detail}; }, "Saved");
      });
    },
    stopLine: function(el, p){
      var l = find(p.lines, el.dataset.id); if(!l) return;
      editModal((l.kind === "Infusion" ? "Stop " : "Remove ") + l.kind, '<p>' + esc(l.detail || l.kind) + ' · Day ' + (dayN(l.start) || "?") + '</p>' + F("note", "Note (optional)", "text", 6, {ph:"e.g. Weaned off, blocked, replaced"}), function(v){
        return commit(function(b, now){ return {ops:[OP("upd", "lines", l.id, {removedAt:now, removedBy:b, removeNote:v.note})], log:(l.kind === "Infusion" ? "Stopped " : "Removed ") + l.kind + ": " + (l.detail || "") + " (day " + dayN(l.start) + ")"}; }, "Done");
      });
    },
    changeAbx: function(el, p){
      var a = find(p.abx, el.dataset.id); if(!a) return;
      editModal("Change " + a.drug, '<p>Change the dose or frequency, or switch to another antibiotic. Staff will see an alert until they mark it as seen.</p><div class="fgrid">' +
        F("drug", "Antibiotic", "text", 3, {list:"dl_abx", value:a.drug}) + F("dose", "Dose", "text", 3, {value:a.dose}) +
        F("route", "Route", "select", 3, {opts:["IV","PO / RT","IM","Nebulised","Topical"], value:a.route}) + F("freq", "Frequency", "text", 3, {list:"dl_freq", value:a.freq}) +
        F("why", "Reason for change", "text", 6, {ph:"e.g. As per culture sensitivity, renal dose adjustment"}) + '</div>', function(v){
        if(!v.drug){ toast("Antibiotic name is needed"); return Promise.resolve(false); }
        return commit(function(b, now){
          var ops, txt;
          if(v.drug.toLowerCase() !== String(a.drug).toLowerCase()){
            txt = "Switched " + a.drug + " → " + v.drug + " " + [v.dose, v.route, v.freq].filter(Boolean).join(" ") + (v.why ? " (" + v.why + ")" : "");
            ops = [OP("upd", "abx", a.id, {stoppedAt:now, stoppedBy:b, hist:(a.hist || []).concat([{at:now, by:b, text:"Stopped, switched to " + v.drug + (v.why ? " (" + v.why + ")" : "")}])}),
                   OP("push", "abx", {id:uid(), drug:v.drug, dose:v.dose, route:v.route, freq:v.freq, start:today(), reason:v.why, at:now, by:b, hist:[{at:now, by:b, text:"Started in place of " + a.drug + (v.why ? " (" + v.why + ")" : "")}]}, 100)];
          } else {
            txt = a.drug + " changed to " + [v.dose, v.route, v.freq].filter(Boolean).join(" ") + (v.why ? " (" + v.why + ")" : "");
            ops = [OP("upd", "abx", a.id, {dose:v.dose, route:v.route, freq:v.freq, changedAt:now, changedBy:b, hist:(a.hist || []).concat([{at:now, by:b, text:"Changed from " + [a.dose, a.route, a.freq].filter(Boolean).join(" ") + " to " + [v.dose, v.route, v.freq].filter(Boolean).join(" ") + (v.why ? " (" + v.why + ")" : "")}])})];
          }
          return {fields:{abxChangedAt:now, abxChangedBy:b, abxLastChange:txt}, ops:ops, log:txt};
        }, "Antibiotic changed");
      });
    },
    stopAbx: function(el, p){
      var a = find(p.abx, el.dataset.id); if(!a) return;
      editModal("Stop " + a.drug, '<p>Day ' + (dayN(a.start) || "?") + ' of ' + esc(a.drug) + '.</p>' + F("why", "Reason", "text", 6, {ph:"e.g. Course completed, culture negative"}), function(v){
        var txt = "Stopped " + a.drug + " on day " + dayN(a.start) + (v.why ? " (" + v.why + ")" : "");
        return commit(function(b, now){ return {fields:{abxChangedAt:now, abxChangedBy:b, abxLastChange:txt}, ops:[OP("upd", "abx", a.id, {stoppedAt:now, stoppedBy:b, hist:(a.hist || []).concat([{at:now, by:b, text:"Stopped on day " + dayN(a.start) + (v.why ? " (" + v.why + ")" : "")}])})], log:txt}; }, "Antibiotic stopped");
      });
    },
    abxSeen: function(){ commit(function(b, now){ return {fields:{abxSeenAt:now, abxSeenBy:b}, log:"Antibiotic change seen"}; }, "Marked as seen"); },
    delIo: function(el){ var id = el.dataset.id; confirmBox("Delete this entry?", "This intake/output entry will be removed.", "Delete", function(){ commit(function(){ return {ops:[OP("del", "io", id)], log:"Deleted an I/O entry"}; }); }); },
    pickLabs: function(el, p){
      var sel = labTests(p);
      var custom = sel.filter(function(t){ return !LAB[t]; });
      modal('<div class="modal-h"><h2>Select investigations</h2><button class="x" type="button" data-close aria-label="Close">×</button></div><p>Ticked tests appear in the report form and the serial chart for this patient.</p><form id="pickF" class="labpick">' +
        LAB_GROUPS.map(function(g){ return '<h4>' + g[0] + '</h4><div class="grp">' + g[1].map(function(t){ return '<label><input type="checkbox" name="t" value="' + esc(t[0]) + '"' + (sel.indexOf(t[0]) >= 0 ? " checked" : "") + '>' + esc(t[0]) + '</label>'; }).join("") + '</div>'; }).join("") +
        '<h4>Other tests</h4><div class="grp" id="custGrp">' + custom.map(function(t){ return '<label><input type="checkbox" name="t" value="' + esc(t) + '" checked>' + esc(t) + '</label>'; }).join("") + '</div>' +
        '<div class="addrow"><input type="text" id="custIn" placeholder="Add another test, e.g. Serum ammonia" aria-label="Other test"><button class="btn" type="button" id="custAdd">Add</button></div>' +
        '<div class="r" style="margin-top:14px"><button class="btn" type="button" data-close>Cancel</button><button class="btn primary" type="submit">Save selection</button></div></form>',
        function(root, close){
          var f = $("#pickF", root);
          function addCustom(){ var v = $("#custIn", root).value.trim(); if(!v) return; $("#custGrp", root).insertAdjacentHTML("beforeend", '<label><input type="checkbox" name="t" value="' + esc(v) + '" checked>' + esc(v) + '</label>'); $("#custIn", root).value = ""; }
          $("#custAdd", root).onclick = addCustom;
          $("#custIn", root).addEventListener("keydown", function(e){ if(e.key === "Enter"){ e.preventDefault(); addCustom(); } });
          f.addEventListener("submit", async function(e){
            e.preventDefault();
            var tests = formData(f).t || [];
            if(!tests.length){ toast("Tick at least one test"); return; }
            var ok = await commit(function(){ return {fields:{labTests:tests}}; }, "Selection saved");
            if(ok){ close(); renderTab(); }
          });
        }, null, true);
    },
    delLab: function(el){ var id = el.dataset.id; confirmBox("Delete this report?", "All values in this lab report column will be removed.", "Delete", function(){ commit(function(){ return {ops:[OP("del", "labs", id)], log:"Deleted a lab report"}; }); }); },
    editCult: function(el, p){
      var c = find(p.cultures, el.dataset.id); if(!c) return;
      editModal("Culture report · " + c.sample, '<div class="fgrid">' +
        F("status", "Result", "select", 3, {opts:CULT_STATUS, value:c.status}) + F("count", "Colony count", "text", 3, {value:c.count, ph:"e.g. >10⁵ CFU/ml"}) +
        F("organism", "Organism(s) isolated", "text", 6, {value:c.organism, list:"dl_org", ph:"Separate two organisms with a comma"}) +
        F("sensitive", "Sensitive to", "textarea", 6, {value:c.sensitive, ph:"e.g. Colistin, Tigecycline, Minocycline"}) +
        F("intermediate", "Intermediate", "text", 6, {value:c.intermediate}) +
        F("resistant", "Resistant to", "textarea", 6, {value:c.resistant, ph:"e.g. Meropenem, Pip-taz, Ceftriaxone, Amikacin"}) + '</div>', function(v){
        var st = (CULT_STATUS.filter(function(s){ return s[0] === v.status; })[0] || [])[1];
        return commit(function(b, now){ return {ops:[OP("upd", "cultures", c.id, {status:v.status, count:v.count, organism:v.status === "growth" || v.status === "contam" ? v.organism : "", sensitive:v.sensitive, intermediate:v.intermediate, resistant:v.resistant, reportAt:now, reportBy:b})], log:"Culture report (" + c.sample + "): " + st + (v.organism && v.status === "growth" ? " · " + v.organism : "")}; }, "Report saved");
      }, true);
    },
    delCult: function(el, p){
      var c = find(p.cultures, el.dataset.id); if(!c) return;
      confirmBox("Delete this culture?", c.sample + " sent " + dshort(c.sent) + " will be removed. Uploaded files stay in the Google Drive folder.", "Delete", function(){ commit(function(){ return {ops:[OP("del", "cultures", c.id)], log:"Deleted culture: " + c.sample}; }); });
    },
    viewFile: function(el){ viewFile(el.dataset.file, el.dataset.name); }
  };

  /* ---------- patient view events ---------- */
  var viewEl = $("#view");
  viewEl.addEventListener("click", function(e){
    var el = e.target.closest("[data-act]"); if(!el || !viewEl.contains(el)) return;
    var fn = ACTS[el.dataset.act]; if(fn) fn(el, cur());
  });
  viewEl.addEventListener("submit", function(e){
    var f = e.target.closest("form[data-form]"); if(!f) return;
    e.preventDefault();
    var fn = FORMS[f.dataset.form]; if(!fn) return;
    var btn = $("button[type=submit]", f); if(btn) btn.disabled = true;
    Promise.resolve(fn(f, cur())).then(function(){ if(btn) btn.disabled = false; }, function(){ if(btn) btn.disabled = false; });
  });
  viewEl.addEventListener("input", function(e){
    var f = e.target.closest("form[data-dirty]"); if(f) view.dirty[f.dataset.dirty] = true;
    var p = cur(); if(!p) return;
    if(f && f.dataset.form === "addVit"){ var m = mapOf({sbp:f.sbp.value, dbp:f.dbp.value}); $("#vitCalc").innerHTML = m ? "MAP <b>" + m + "</b> mmHg" : ""; }
    if(f && f.dataset.form === "addResp"){ var w = num(p.weight), vt = num(f.vt.value); $("#respCalc").innerHTML = w && vt ? "Vt <b>" + (vt/w).toFixed(1) + "</b> ml/kg (actual body weight)" : ""; }
    if(f && f.dataset.form === "addAbg"){ var pf = pfOf(f.po2.value, f.fio2.value); $("#abgCalc").innerHTML = pf ? "P/F ratio <b>" + pf + "</b>" : ""; }
  });
  viewEl.addEventListener("change", function(e){
    var t = e.target, p = cur(); if(!p) return;
    var chg = t.dataset.chg;
    if(t.name === "insType"){ syncIns(t.closest("form")); return; }
    if(chg === "mgmt"){ var f = t.closest("form"); if(f) f.dataset.mgmt = t.value; }
    else if(chg === "iv"){
      var id = t.dataset.id, done = t.checked, it = find(p.interventions, id);
      commit(function(b, now){ return {ops:[OP("upd", "interventions", id, {done:done, doneAt:done ? now : null, doneBy:done ? b : null})], log:(done ? "Done: " : "Reopened: ") + (it ? it.text : "")}; });
    }
    else if(chg === "upload"){
      var file = t.files && t.files[0]; if(!file) return;
      var cid = t.dataset.id;
      (async function(){
        var by = await needSig(); if(!by){ t.value = ""; return; }
        toast("Uploading " + file.name + "…");
        try{ var x = await prepFile(file); await Store.upload({id:p.id, cid:cid, name:x.name, mime:x.mime, b64:x.b64, by:by}); toast("Report uploaded"); }
        catch(err){ toast(writeErr(err)); }
        t.value = "";
      })();
    }
  });

  /* ---------- gate ---------- */
  function showGate(msg){ $("#gate").hidden = false; $("#gateErr").textContent = msg || ""; setTimeout(function(){ $("#pinInput").focus(); }, 30); }
  function submitPin(){
    var v = $("#pinInput").value.trim(); if(!v) return;
    $("#pinGo").disabled = true; $("#gateErr").textContent = "";
    Store.pin = v;
    Store.call("list").then(function(r){
      LS.set(PKEY, v); $("#pinInput").value = ""; $("#gate").hidden = true; $("#pinGo").disabled = false;
      Store.take(r); Store.startPolling();
    }, function(e){
      Store.pin = ""; $("#pinGo").disabled = false;
      $("#gateErr").textContent = e.code === "pin" ? "Wrong PIN. Try again." : "Couldn't connect. Check the internet and try again.";
    });
  }

  /* ---------- page events ---------- */
  $("#q").addEventListener("input", function(e){ query = e.target.value.trim(); paintGrid(); });
  $("#tabs").addEventListener("click", function(e){ var b = e.target.closest("[data-f]"); if(!b) return; filter = b.dataset.f; paintFilters(); paintGrid(); });
  $("#grid").addEventListener("click", function(e){ var c = e.target.closest("[data-open]"); if(c) openPatient(c.dataset.open, "sum"); });
  $("#empty").addEventListener("click", function(e){ if(e.target.closest("[data-admit]")) openAdmit(); });
  $("#admitBtn").onclick = openAdmit;
  $("#sigBtn").onclick = function(){ askSig(); };
  $("#printBtn").onclick = function(){ paintPrint(); window.print(); };
  window.addEventListener("beforeprint", paintPrint);
  $("#refreshBtn").onclick = function(){ $("#sync").textContent = "syncing…"; Store.refresh().then(paintSync); };
  $("#lockBtn").onclick = function(){
    if(Store.mode === "local"){ toast("Lock works once the page is connected to Google"); return; }
    closeView(true); Store.pin = ""; LS.set(PKEY, ""); patients = []; paintAll(); showGate("");
  };
  $("#gateForm").addEventListener("submit", submitPin);
  document.addEventListener("keydown", function(e){
    if(e.key !== "Escape") return;
    var m = $("#modalRoot").lastElementChild;
    if(m && m._cancel){ m._cancel(); return; }
    if(view.id) closeView();
  });

  /* ---------- boot ---------- */
  paintSig(); paintClock(); paintAll(); paintSync();
  setInterval(function(){ paintClock(); paintAll(); }, 60000);
  setInterval(paintSync, 10000);
  Store.init(function(list){ patients = list || []; loaded = true; paintAll(); refreshView(); });
  if(Store.mode === "local") showBanner("Preview mode: this copy isn't connected to Google yet, so changes are saved on this device only.");
})();
</script>
